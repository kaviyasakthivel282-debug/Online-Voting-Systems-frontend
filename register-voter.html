<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register Voter | Online Voting System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="navbar">
  <a href="index.html" class="brand">🗳️ Online Voting System</a>
  <nav>
    <a href="register-voter.html">Register</a>
    <a href="login.html">Login &amp; Vote</a>
    <a href="register-candidate.html">Add Candidate</a>
    <a href="results.html">Live Results</a>
  </nav>
</div>

<div class="container">
  <div class="card" style="max-width:480px;margin:0 auto;">
    <h1>Voter Registration</h1>
    <p style="color:var(--muted);margin-top:-10px;">Create your account to be able to cast a vote.</p>

    <div id="alertBox" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g. john@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 4 characters" required />
      </div>
      <button type="submit" class="btn" style="width:100%;" id="submitBtn">Register</button>
    </form>

    <p class="footer-note">Already registered? <a href="login.html">Login here</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/register-voter.js"></script>
</body>
</html>
