 <h2>Select Your Candidate</h2>

<button onclick="castVote('Kaviya')">
    Vote for Kaviya
</button>

<button onclick="castVote('Alice Johnson')">
    Vote for Alice Johnson
</button>

<button onclick="castVote('Aasha')">
    Vote for Aasha
</button>

<button onclick="castVote('Bob Williams')">
    Vote for Bob Williams
</button>

<button onclick="castVote('Carol Davis')">
    Vote for Carol Davis
</button>

<script>
function castVote(candidate) {

    let votes = JSON.parse(localStorage.getItem("votes")) || {};

    if (!votes[candidate]) {
        votes[candidate] = 0;
    }

    votes[candidate]++;

    localStorage.setItem("votes", JSON.stringify(votes));

    alert("Your vote has been successfully cast!");

window.location.href = "vote.html";
}
</script>
